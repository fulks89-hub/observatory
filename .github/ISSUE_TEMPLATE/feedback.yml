name: Bug, question, or feedback
description: Report a reproducible problem or suggest an improvement using synthetic examples.
body:
  - type: markdown
    attributes:
      value: "This is public. Remove personal notes, credentials, and private paths. Read SECURITY.md before reporting security concerns."
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Setup or bug report
        - Question
        - Improvement suggestion
        - Tried Observatory — experience report
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you try, what worked, and where did you get stuck? For bugs, include what you expected and steps to reproduce. Use synthetic examples; do not include email addresses or other personal contact details.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, and release or commit, if relevant. No private paths.
